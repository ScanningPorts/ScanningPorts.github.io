<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta name="robots" content="noindex, nofollow" />
        <title>endrosity's vault</title>
        <link rel="icon" type="image/x-icon" href="assets/misc/favi.png" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script src="assets/js/main.js" defer></script>
    </head>

    <body>
        <div id="loading-overlay">
            <span id="loading-progress">Loading buy-drugs.online: 0% (0.00s)</span>
        </div>

        <noscript>
            <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 1.5em;">
                Please enable JavaScript to continue, you fat retard. Kill yourself.
            </div>
        </noscript>

        <canvas id="particle-canvas"></canvas>

        <video
            id="bg-video"
            playsinline
            preload="metadata"
            disablepictureinpicture
            controlslist="nodownload nofullscreen noremoteplayback"
            style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;"
        ></video>

        <video id="bg-video-prefetch" muted playsinline preload="auto" style="display:none"></video>

        <div class="player">
            <div class="player-controls">
                <button id="mute-btn" class="icon-button">
                    <img id="mute-icon" src="assets/buttons/speaker-unmuted.png" width="28" height="28" alt="" />
                </button>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" />
                <button id="prev-btn" class="icon-button">
                    <img src="assets/buttons/skip-back.png" width="28" height="28" alt="" />
                </button>
                <button id="play-btn" class="icon-button">
                    <img id="play-icon" src="assets/buttons/play.png" width="28" height="28" alt="" />
                </button>
                <button id="next-btn" class="icon-button">
                    <img src="assets/buttons/skip-forward.png" width="28" height="28" alt="" />
                </button>
                <button id="shuffle-btn" class="icon-button">
                    <img id="shuffle-icon" src="assets/buttons/noshuffle.png" width="28" height="28" alt="" />
                </button>
                <span id="track-time">0:00 | 0:00</span>
            </div>
            <div class="player-info">
                <span id="now-playing"></span>
                <span id="track-counter">Track: 0 / 0</span>
            </div>
        </div>

        <div class="swinger">
            <img id="swinger-image" src="" alt="" />
        </div>

        <div class="elsewhere">
            <span id="elsewhere-link" class="elsewhere-link" role="link" tabindex="0" data-href="https://emogir.ls/cute">Find me elsewhere</span>
        </div>

        <div class="credits-button" id="credits-toggle">?</div>

        <div id="credits-overlay">
            <div class="credits-content" id="credits-content">
                <p>Made by <span class="highlight" role="link" tabindex="0" data-href="https://guns.lol/kunt">@kunt</span></p>
                <img src="assets/misc/kunt.png" class="top-image" width="150" draggable="false" ondragstart="return false" alt="" />
            </div>
        </div>

        <div id="seek-indicator-left" class="seek-indicator left">
            <img src="assets/buttons/goleft.png" width="54" height="54" alt="" />
            <span>-5s</span>
        </div>
        <div id="seek-indicator-right" class="seek-indicator right">
            <img src="assets/buttons/goright.png" width="54" height="54" alt="" />
            <span>+5s</span>
        </div>

        <div class="signature">endrosity</div>

        <div class="reload-bar">
            <button id="reload-btn" class="reload-button">
                <img src="assets/buttons/reload.png" width="24" height="24" alt="" />
                <span>Reload Image</span>
            </button>
            <button id="swinger-toggle-btn" class="reload-button">
                <img id="swinger-toggle-icon" src="assets/buttons/on.png" width="24" height="24" alt="" />
                <span id="swinger-toggle-label">Disable Image</span>
            </button>
        </div>
    </body>
</html>
